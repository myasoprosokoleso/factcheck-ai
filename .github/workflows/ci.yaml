name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        shell: bash
        run: |
          unformatted="$(
            git ls-files -z -- '*.go' |
              xargs -0 --no-run-if-empty gofmt -l
          )"

          if [[ -n "$unformatted" ]]; then
            echo "The following files are not formatted:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2


  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod verify
      - run: go test -mod=readonly ./test/...
      - run: go build -mod=readonly -o "$RUNNER_TEMP/factcheck" ./cmd/factcheck
